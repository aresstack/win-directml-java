POM_NAME=win-directml-java :: inference
POM_DESCRIPTION=Neutral, swing-free Java 21 local generation runtime for Windows DirectML/WARP. Public API in com.aresstack.windirectml.inference.api (GenerationRuntime, GenerationModelHandle, catalog-driven family adapters for Qwen, SmolLM2, Gemma 3, Phi-3 and T5/CodeT5); loads package-only from *.wdmlpack. No Swing, no workbench, no ONNX Runtime, no Python.

