POM_NAME=win-directml-java :: model-catalog
POM_DESCRIPTION=Neutral, dependency-free Java 8 catalog of local win-directml model families: the single source of truth for Hugging Face repo, runtime model id, family, capabilities, download manifest, wdmlpack package name, tokenizer/chat template, allowed-backend matrix and RUNNABLE/UNVERIFIED status, plus the fail-closed installed-model manifest contract.
